<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' data: blob: file:; script-src 'self'">
<link rel="stylesheet" href="zones.css">
<style>
@font-face{font-family:"SUIT";src:url(fonts/suit.woff2) format("woff2");font-weight:400 700}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"SUIT",system-ui,sans-serif}
#stage{position:absolute;bottom:8px;left:50%;transform:translateX(-50%)}
#stage.hand{cursor:pointer}
#inner{position:absolute;inset:0}
.shadow{position:absolute;left:24%;right:24%;bottom:4%;height:7%;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(2px)}
.ck{inset:0}
.one{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:50% 100%;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes bubIn{from{opacity:0;transform:translate(-50%,4px)}}
</style></head>
<body><div id="stage"></div><script src="zones.js"></script><script src="pet.js"></script></body></html>
