name: 앱 만들기 (안드로이드 · PC)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 번호 (예전 저장소의 13번 다음부터 이어서)
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 안드로이드 SDK 라이선스
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 웹 파일 → 안드로이드
        run: |
          echo "{\"build\": ${{ env.BUILD }}}" > web/build.json
          npm ci
          npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 이름 붙이기
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dday-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dday-app
          path: dday-app.apk

      - name: 다운로드 링크(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD }}
          name: 기념일 D-day 1.0.${{ env.BUILD }}
          body: |
            **안드로이드**: 폰에서 dday-app.apk 를 눌러 받아 설치하세요. 처음 한 번은 '출처를 알 수 없는 앱 설치'를 허용해야 해요. 다음부터는 덮어 설치하면 데이터가 그대로 남아요.
            **PC(윈도우)**: AnniversaryDday-Windows.zip 을 받아 압축을 풀고 AnniversaryDday.exe 를 실행하세요. 'Windows의 PC 보호' 창이 뜨면 [추가 정보] → [실행]을 누르세요.
          files: dday-app.apk
          make_latest: true

  pc:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 번호 (예전 저장소의 13번 다음부터 이어서)
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: PC(윈도우)용 만들기 (Tauri · 가벼운 버전)
        working-directory: desktop-tauri
        shell: bash
        run: |
          echo "{\"build\": ${{ env.BUILD }}}" > ../desktop/app/build.json
          npm install --no-audit --no-fund
          node build.js
          npx tauri build --config "{\"version\":\"1.0.${{ env.BUILD }}\"}"
          mkdir -p ../out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe ../out/AnniversaryDday-Setup.exe
          cp src-tauri/target/release/AnniversaryDday.exe ../out/AnniversaryDday-Portable.exe 2>/dev/null || cp src-tauri/target/release/anniversary-dday.exe ../out/AnniversaryDday-Portable.exe
          ls -la ../out

      - name: 같은 다운로드 링크에 PC 버전 추가
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD }}
          files: |
            out/AnniversaryDday-Setup.exe
            out/AnniversaryDday-Portable.exe

  mac:
    needs: apk
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 번호 (예전 저장소의 13번 다음부터 이어서)
        shell: bash
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: 맥용 만들기 (인텔 · 애플 칩 둘 다)
        working-directory: desktop-tauri
        run: |
          echo "{\"build\": ${{ env.BUILD }}}" > ../desktop/app/build.json
          npm install --no-audit --no-fund
          node build.js
          npx tauri build --target universal-apple-darwin --bundles dmg --config "{\"version\":\"1.0.${{ env.BUILD }}\"}"
          mkdir -p ../out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/AnniversaryDday-mac.dmg
          ls -la ../out

      - name: 같은 다운로드 링크에 맥 버전 추가
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD }}
          files: out/AnniversaryDday-mac.dmg

      - name: 사이트 맥 버튼 자리(mac-latest)도 새 파일로
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mac-latest -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create mac-latest -R "${{ github.repository }}" --title "맥 최신 버전" --notes "맥(dmg) 최신 빌드" --latest=false --target "${GITHUB_SHA}"
          gh release upload mac-latest out/AnniversaryDday-mac.dmg -R "${{ github.repository }}" --clobber
