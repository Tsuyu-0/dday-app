name: 맥 테스트 빌드 (공개 안 함)

on:
  push:
    branches: [mac-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target

      - name: 맥용 만들기 (인텔 · 애플 칩 둘 다)
        working-directory: desktop-tauri
        run: |
          echo '{"build": 0}' > ../desktop/app/build.json
          npm install --no-audit --no-fund
          node build.js
          npx tauri build --target universal-apple-darwin --bundles dmg --config '{"version":"1.0.0"}'
          mkdir -p ../out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg ../out/AnniversaryDday-mac-test.dmg
          ls -la ../out

      # 공개 안 되는 '초안' 릴리스에만 올려요 (최신 버전 링크에는 안 잡혀요)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-test
          name: 맥 테스트 (비공개 초안)
          draft: true
          target_commitish: mac-test
          files: out/AnniversaryDday-mac-test.dmg
